#setup{padding:20px;text-align:center;background:#0f172a;margin:20px;border-radius:12px;border:1px dashed var(--gold)}

  document.getElementById('setup').style.display='none';
  chatBox.style.display='flex';
  document.getElementById('inputArea').style.display='flex';
  tambahMsg('ai','Halo! Saya RYAN HIDAYAT V9.3<br>'+genMenuInfo());
}
function genMenuInfo(){
  return '<div class="btns"><button class="cuaca" onclick="showCuaca()">🌤️ Cuaca Lengkap</button><button class="asap" onclick="showAsap()">🌫️ Kabut Asap</button><button class="api" onclick="showHotspot()">🔥 Titik Api</button></div>';
}
function saveKey(){
  let k=document.getElementById('apiKey').value.trim();
  if(!k) return alert('Isi API Key');
  localStorage.setItem('GEMINI_KEY',k);
  location.reload();
}
function tambahMsg(from,html){
  let div=document.createElement('div');
  div.className='msg '+from;
  div.innerHTML=html;
  chatBox.appendChild(div);
  chatBox.scrollTop=chatBox.scrollHeight;
  return div;
}
async function showCuaca(){
  tambahMsg('user','Cuaca Lengkap - Semua Negara & Indonesia');
  let div=tambahMsg('ai','Loading fitur cuaca lengkap...');
  let optionsNegara = ALL_COUNTRIES.map(c=>`<option value="${c}" ${c==="Indonesia"?"selected":""}>${c}</option>`).join('');
  let optionsProv = Object.keys(INDONESIA_LENGKAP).sort().map(p=>`<option value="${p}">${p}</option>`).join('');
  div.innerHTML=`
    <b>🌍 CUACA LENGKAP V9.3 - 195 NEGARA + 38 PROVINSI</b>
    <div class="detail-box">
      <label>1. Pilih Negara:</label>
      <select id="negaraSel" onchange="onNegaraGanti()">${optionsNegara}</select>
      <div id="indoBox">
        <label>2. Pilih Provinsi:</label>
        <select id="provSel" onchange="onProvGanti()"><option value="">-- Pilih Provinsi --</option>${optionsProv}</select>
        <label>3. Pilih Kota/Kabupaten:</label>
        <select id="kotaSel"><option value="">-- Pilih Kota --</option></select>
      </div>
      <div id="globalBox" style="display:none">
        <label>Ketik Kota di Luar Negeri:</label>
        <input id="kotaGlobal" placeholder="Contoh: Tokyo, London, Mecca, New York" style="width:95%">
      </div>
      <button onclick="cekCuacaBaru()" style="background:#0ea5e9;color:white;width:100%;padding:12px;border-radius:20px;border:none;font-weight:bold;margin-top:10px">🔍 CEK CUACA SEKARANG</button>
      <div id="hasilCuaca" style="margin-top:10px"></div>
    </div>
  `;
  onNegaraGanti();
}
function onNegaraGanti(){
  let negara = document.getElementById('negaraSel').value;
  let indoBox = document.getElementById('indoBox');
  let globalBox = document.getElementById('globalBox');
  if(negara==="Indonesia"){
    indoBox.style.display="block";
    globalBox.style.display="none";
  } else {
    indoBox.style.display="none";
    globalBox.style.display="block";
    document.getElementById('kotaGlobal').placeholder=`Ketik kota di ${negara}...`;
  }
}
function onProvGanti(){
  let prov = document.getElementById('provSel').value;
  let kotaSel = document.getElementById('kotaSel');
  kotaSel.innerHTML='<option value="">-- Pilih Kota --</option>';
  if(INDONESIA_LENGKAP[prov]){
    INDONESIA_LENGKAP[prov].forEach(k=>{
      let o=document.createElement('option');
      o.value=k; o.textContent=k;
      kotaSel.appendChild(o);
    });
  }
}
async function cekCuacaBaru(){
  let negara = document.getElementById('negaraSel').value;
  let hasil = document.getElementById('hasilCuaca');
  let lokasi = "";
  if(negara==="Indonesia"){
    let prov = document.getElementById('provSel').value;
    let kota = document.getElementById('kotaSel').value;
    if(!prov ||!kota){ hasil.innerHTML="⚠️ Pilih Provinsi & Kota dulu bang!"; return; }
    lokasi = `${kota}, ${prov}, Indonesia`;
  } else {
    let kotaG = document.getElementById('kotaGlobal').value.trim();
    if(!kotaG){ hasil.innerHTML="⚠️ Ketik nama kota dulu!"; return; }
    lokasi = `${kotaG}, ${negara}`;
  }
  hasil.innerHTML=`⏳ Cek cuaca <b>${lokasi}</b>...`;
  try{
    let r=await fetch(`https://wttr.in/${encodeURIComponent(lokasi)}?format=j1`);
    let data=await r.json();
    let curr = data.current_condition[0];
    let suhu = curr.temp_C;
    let desc = curr.weatherDesc[0].value;
    let lembab = curr.humidity;
    let angin = curr.windspeedKmph;
    hasil.innerHTML=`
      <div class="weather-card">
        <b>📍 ${lokasi}</b><br><br>
        🌤️ ${desc}<br>
        🌡️ Suhu: ${suhu}°C<br>
        💧 Kelembaban: ${lembab}%<br>
        💨 Angin: ${angin} km/h<br><br>
        <small>✅ RYAN HIDAYAT V9.1</small>
      </div>
    `;
  }catch(e){
    let r2=await fetch(`https://wttr.in/${encodeURIComponent(lokasi)}?format=%C+%t+%h+%w`);
    let t=await r2.text();
    hasil.innerHTML=`
      <div class="weather-card">
        <b>📍 ${lokasi}</b><br><br>
        🌤️ ${t}<br><br>
        <small>✅ RYAN HIDAYAT V9.1</small>
      </div>
    `;
  }
}
async function showAsap(){
  tambahMsg('user','Info Kabut Asap');
  let loading=tambahMsg('ai','Lagi cek udara...');
  try{
    let res=await fetch('https://air-quality-api.open-meteo.com/v1/air-quality?latitude=0.5071&longitude=101.4478&current=us_aqi,pm2_5');
    let data=await res.json();
    let aqi=data.current.us_aqi;
    let pm25=data.current.pm2_5;
    let warna=aqi<=50?'#22c55e':aqi<=100?'#eab308':'#ef4444';
    loading.innerHTML=`<b>Kabut Asap Pekanbaru LIVE</b><div class="asap-card" style="background:${warna}">ISPU: ${aqi}<br>PM2.5: ${pm25}<br>${new Date().toLocaleString('id-ID')}</div><div class="btns"><button class="cuaca" onclick="showCuaca()">Cuaca Lengkap</button><button class="api" onclick="showHotspot()">Titik Api</button></div>`;
  }catch(e){loading.innerHTML='Gagal load asap';}
}

    <div class="btns" style="margin-top:10px">
      <button class="asap" onclick="showAsap()">🌫️ Cek Asapnya</button>
      <button class="cuaca" onclick="showCuaca()">🌤️ Cuaca Lengkap</button>
    </div>
  `;
}
async function kirim(){
  let input=document.getElementById('pesan');
  let text=input.value.trim();
  if(!text) return;
  let lower=text.toLowerCase();
  if(lower.indexOf('cuaca')>=0){input.value='';showCuaca();return;}
  if(lower.indexOf('asap')>=0 || lower.indexOf('kabut')>=0){input.value='';showAsap();return;}
  if(lower.indexOf('titik api')>=0 || lower.indexOf('kebakaran')>=0){input.value='';showHotspot();return;}
  tambahMsg('user',text);
  input.value='';
  tambahMsg('ai','Balas: '+text+'<br>'+genMenuInfo());
}
</script>
</body>
</html>
