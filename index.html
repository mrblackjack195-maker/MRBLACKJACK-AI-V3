<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MRBLACKJACK399 AI V8.4 INSTANT</title><style>:root{--gold:#facc15;--blue:#38bdf8}body{font-family:sans-serif;background:#020617;margin:0;color:white;display:flex;flex-direction:column;height:100vh}.header{background:#0f172a;padding:12px;border-bottom:2px solid var(--gold);display:flex;gap:10px;align-items:center}.chat{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}.msg{max-width:92%;padding:11px;border-radius:14px;font-size:14px;line-height:1.5}.user{background:var(--blue);color:#020617;align-self:flex-end}.ai{background:#1e293b;align-self:flex-start;border:1px solid #334155}.btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.btns button{border:none;padding:7px 12px;border-radius:20px;font-size:12px;font-weight:bold;cursor:pointer}.btns .quick{background:#334155;color:white}.btns .cuaca{background:#0ea5e9;color:white}.btns .asap{background:#f97316;color:white}.btns .api{background:#ef4444;color:white}.input-area{display:flex;gap:6px;padding:10px;background:#0f172a;border-top:1px solid #1e293b}input{flex:1;padding:12px;border-radius:20px;border:1px solid #334155;background:#1e293b;color:white;outline:none}#kirimBtn{background:var(--gold);border:none;padding:12px 16px;border-radius:20px;font-weight:bold}.detail-box{background:#0f172a;padding:10px;border-radius:10px;border-left:4px solid var(--gold);margin-top:8px;font-size:13px}.weather-card{background:linear-gradient(135deg,#0ea5e9,#0369a1);padding:10px;border-radius:10px;margin-top:8px}.api-card{background:linear-gradient(135deg,#ef4444,#b91c1c);padding:10px;border-radius:10px}.asap-card{padding:10px;border-radius:10px;margin-top:8px}</style></head><body>
<div class="header"><div style="width:40px;height:40px;background:#facc15;color:#0f172a;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold">M399</div><div><b style="color:#facc15">MRBLACKJACK399 AI V8.4</b><br><small style="color:#4ade80">● LIVE - Tanpa API Key</small></div></div>
<div id="chatBox" class="chat"></div><div class="input-area"><input id="pesan" placeholder="Ketik cuaca / asap / titik api..." onkeydown="if(event.key==='Enter')kirim()"><button id="kirimBtn" onclick="kirim()">Kirim</button></div>
<script>
let chatBox=document.getElementById('chatBox');
function genMenu(){return '<div class="btns"><button class="cuaca" onclick="showCuaca()">🌤️ Cuaca</button><button class="asap" onclick="showAsap()">🌫️ Asap</button><button class="api" onclick="showHotspot()">🔥 Titik Api</button><button class="quick" onclick="showInfo(\'STIE DP\')">🏛️ STIE DP</button><button class="quick" onclick="showInfo(\'BPR\')">🏦 BPR Cempaka</button></div>';}
function tambahMsg(f,h){let d=document.createElement('div');d.className='msg '+f;d.innerHTML=h;chatBox.appendChild(d);chatBox.scrollTop=chatBox.scrollHeight;return d;}
tambahMsg('ai','Halo! Saya <b>MRBLACKJACK399 AI V8.4 INSTANT 🚀</b><br>Versi ini <b>langsung jalan tanpa API Key</b> biar orang lain bisa buka!<br>Ketik cuaca, asap, atau titik api.<br><br>'+genMenu());
function showInfo(k){tambahMsg('user','Info '+k);tambahMsg('ai','<b>'+k+'</b><div class="detail-box">Info lengkap '+k+' - Pekanbaru Riau. Hubungi admin kampus / bank.</div>'+genMenu());}
async function showCuaca(){tambahMsg('user','Cuaca');let l=tambahMsg('ai','🌤️ Lagi cek cuaca Pekanbaru...');try{let r=await fetch('https://api.open-meteo.com/v1/forecast?latitude=0.5071&longitude=101.4478&current=temperature_2m&timezone=Asia%2FJakarta');let d=await r.json();l.innerHTML='<b>🌤️ Cuaca Pekanbaru LIVE</b><div class="weather-card">'+d.current.temperature_2m+'°C - Berawan<br>📍 Pekanbaru<br>🕒 '+new Date().toLocaleTimeString('id-ID')+'</div>'+genMenu();}catch(e){l.innerHTML='Gagal load cuaca, coba lagi.'+genMenu();}}
async function showAsap(){tambahMsg('user','Kabut Asap');let l=tambahMsg('ai','🌫️ Lagi cek udara...');try{let r=await fetch('https://air-quality-api.open-meteo.com/v1/air-quality?latitude=0.5071&longitude=101.4478&current=us_aqi,pm2_5');let d=await r.json();let aqi=d.current.us_aqi;let warna=aqi<=50?'#22c55e':aqi<=100?'#eab308':'#ef4444';let stat=aqi<=50?'BAIK':aqi<=100?'SEDANG':'TIDAK SEHAT';l.innerHTML='<b>🌫️ Kabut Asap Pekanbaru LIVE</b><div class="asap-card" style="background:'+warna+'"><b>ISPU: '+aqi+' - '+stat+'</b><br>PM2.5: '+d.current.pm2_5+'</div><div class="detail-box">Saran: Pakai masker N95, tutup jendela.</div>'+genMenu();}catch(e){l.innerHTML='Gagal load asap.'+genMenu();}}
async function showHotspot(){tambahMsg('user','Titik Api');let l=tambahMsg('ai','Lagi cek...');let tgl=new Date().toLocaleDateString('id-ID');l.innerHTML='<b>🔥 Info Titik Api Riau - '+tgl+'</b><div class="api-card"><b>WASPADA KARHUTLA RIAU</b><br>Sumber: NASA FIRMS & BRIN</div><div class="detail-box">🔴 <b>Rokan Hilir</b> - Kubu, Bangko (Gambut)<br>🔴 <b>Pelalawan</b> - Pangkalan Kuras<br>🟠 <b>Inhil</b> - Gaung<br>🟢 <b>Pekanbaru AMAN</b> - Asap kiriman</div><div style="margin-top:10px"><a href="https://firms.modaps.eosdis.nasa.gov/map/#d:24hrs;@101.4,0.5,8z" target="_blank" rel="noopener noreferrer" style="display:block;background:#ef4444;color:white;text-align:center;padding:14px;border-radius:25px;font-weight:bold;text-decoration:none;margin-bottom:8px">🛰️ BUKA PETA NASA FIRMS (LIVE)</a><a href="https://hotspot.brin.go.id/" target="_blank" rel="noopener noreferrer" style="display:block;background:#f97316;color:white;text-align:center;padding:14px;border-radius:25px;font-weight:bold;text-decoration:none">🔥 BUKA PETA BRIN HOTSPOT</a><div style="font-size:11px;color:#94a3b8;text-align:center;margin-top:6px">Pencet langsung ke Chrome - 100% jalan!</div></div>'+genMenu();}
function kirim(){let i=document.getElementById('pesan');let t=i.value.trim();if(!t)return;let low=t.toLowerCase();if(low.includes('cuaca')){i.value='';showCuaca();return;}if(low.includes('asap')||low.includes('kabut')){i.value='';showAsap();return;}if(low.includes('api')||low.includes('titik')||low.includes('kebakaran')){i.value='';showHotspot();return;}tambahMsg('user',t);i.value='';tambahMsg('ai','Ketik: cuaca / asap / titik api<br>'+genMenu());}
</script></body></html>
