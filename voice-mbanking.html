<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MRBLACK FINAL</title><style>body{background:#080808;color:#fff;font-family:sans-serif;text-align:center;padding:20px}h1{color:#0f8}.mic{width:120px;height:120px;background:linear-gradient(135deg,#0f8,#0af);border-radius:50%;margin:20px auto;display:flex;align-items:center;justify-content:center;font-size:60px;box-shadow:0 0 30px #0f8}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}.card{background:#151515;border:1px solid #333;border-radius:16px;padding:16px}.card.rio{background:#2a2400;border:2px solid #fc0;grid-column:span 2}#log{color:#0f8;margin:15px 0;font-weight:bold}</style></head><body><h1>MRBLACKJACK V3 FINAL</h1><div class="mic" onclick="startVoice()">🎤</div><div id="log">Tap RIO RISE langsung buka!</div><div class="grid"><div class="card rio" onclick="openApp('com.roleplay.riorise')"><b style="color:#fc0">🔥 RIO RISE v4.16.1 🔥</b><br><small>com.roleplay.riorise</small></div><div class="card" onclick="openApp('com.bca.mbanking')"><b>BCA</b></div><div class="card" onclick="openApp('com.bmri.livin')"><b>Mandiri</b></div><div class="card" onclick="openApp('com.bri.brimo')"><b>BRI</b></div><div class="card" onclick="openApp('com.bni.wondr')"><b>BNI wondr</b></div></div><script>function openApp(pkg){document.getElementById('log').innerText='Membuka '+pkg;location.href='intent://#Intent;package='+pkg+';action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;end'}function startVoice(){var R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return alert('Pakai Chrome');var r=new R();r.lang='id-ID';r.onresult=function(e){var t=e.results[0][0].transcript.toLowerCase();if(t.includes('rio'))openApp('com.roleplay.riorise');else if(t.includes('bca'))openApp('com.bca.mbanking');else if(t.includes('bri'))openApp('com.bri.brimo');else if(t.includes('mandiri'))openApp('com.bmri.livin')};r.start()}</script></body></html>
