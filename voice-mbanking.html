<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MRBLACKJACK V3</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a0a;color:#fff;font-family:system-ui;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:20px}h1{margin:20px 0 10px;font-size:28px;background:linear-gradient(90deg,#00ff88,#00aaff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.sub{color:#888;margin-bottom:25px;text-align:center}.mic{width:120px;height:120px;border-radius:50%;border:none;background:linear-gradient(135deg,#00ff88,#00aaff);font-size:50px;cursor:pointer;box-shadow:0 0 30px rgba(0,255,136,.5)}#status{margin-top:20px;font-size:18px;color:#00ff88;min-height:24px;text-align:center}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;width:100%;max-width:700px;margin-top:30px}.card{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:12px;padding:12px;text-align:center;cursor:pointer}.card:hover{border-color:#00ff88}.card b{display:block;margin-bottom:4px;font-size:14px}.card span{font-size:11px;color:#666}.rio{background:linear-gradient(135deg,#1a1a1a,#2a1a00);border-color:#ffaa00}.rio b{color:#ffaa00}</style></head><body><h1>MRBLACKJACK AI V3</h1><p class="sub">Voice Launcher - All Mbanking + Rio Rise<br>Klik kartu atau bilang "Buka BCA"</p><button class="mic" onclick="startVoice()">🎤</button><div id="status">Tekan mic bilang "Buka BCA" atau "Buka Rio Rise"</div><div class="grid" id="grid"></div><script>const banks=[{k:["bca"],n:"BCA",pkg:"com.bca",url:"https://play.google.com/store/apps/details?id=com.bca"},{k:["mandiri","livin"],n:"Mandiri",pkg:"com.bmri.livin",url:"https://play.google.com/store/apps/details?id=com.bmri.livin"},{k:["bri","brimo"],n:"BRI",pkg:"com.bri.brimo",url:"https://play.google.com/store/apps/details?id=com.bri.brimo"},{k:["bni","wondr"],n:"BNI",pkg:"com.bni.wondr",url:"https://play.google.com/store/apps/details?id=com.bni.wondr"},{k:["cimb","octo"],n:"CIMB",pkg:"com.cimbniaga.octo",url:"https://play.google.com/store/apps/details?id=com.cimbniaga.octo"},{k:["danamon"],n:"Danamon",pkg:"id.co.danamon.mobile",url:"https://play.google.com/store/apps/details?id=id.co.danamon.mobile"},{k:["permata"],n:"Permata",pkg:"com.permata",url:"https://play.google.com/store/apps/details?id=com.permata"},{k:["btn"],n:"BTN",pkg:"id.co.btn.banking",url:"https://play.google.com/store/apps/details?id=id.co.btn.banking"},{k:["bsi"],n:"BSI",pkg:"com.bsi.mobile",url:"https://play.google.com/store/apps/details?id=com.bsi.mobile"},{k:["maybank","m2u"],n:"Maybank",pkg:"com.maybank2u.life",url:"https://play.google.com/store/apps/details?id=com.maybank2u.life"},{k:["jago"],n:"Jago",pkg:"com.jago",url:"https://play.google.com/store/apps/details?id=com.jago"},{k:["seabank"],n:"SeaBank",pkg:"com.seabank",url:"https://play.google.com/store/apps/details?id=com.seabank"},{k:["blu"],n:"blu",pkg:"com.bcadigital.blu",url:"https://play.google.com/store/apps/details?id=com.bcadigital.blu"},{k:["neo"],n:"Neo",pkg:"com.bnc.finance",url:"https://play.google.com/store/apps/details?id=com.bnc.finance"},{k:["rio","rise"],n:"RIO RISE",pkg:"com.riorise.game",url:"https://play.google.com/store/search?q=Rio%20Rise&c=apps",rio:1}];const grid=document.getElementById('grid');banks.forEach(b=>{const d=document.createElement('div');d.className='card'+(b.rio?' rio':'');d.innerHTML=`<b>${b.n}</b><span>${b.pkg}</span>`;d.onclick=()=>openBank(b);grid.appendChild(d)});function openBank(b){document.getElementById('status').innerText='Membuka '+b.n+'...';location.href=`intent://#Intent;package=${b.pkg};scheme=https;end`;setTimeout(()=>{open(b.url,'_blank')},1200)}function startVoice(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert('Pakai Chrome');return}const rec=new SR();rec.lang='id-ID';document.getElementById('status').innerText='Mendengarkan...';rec.start();rec.onresult=e=>{const t=e.results[0][0].transcript.toLowerCase();let f=null;for(let b of banks){for(let k of b.k){if(t.includes(k)){f=b;break}}if(f)break}if(f)openBank(f);else document.getElementById('status').innerText='Ga ketemu: '+t};}</script></body></html>
